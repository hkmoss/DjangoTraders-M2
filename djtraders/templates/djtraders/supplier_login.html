<!--
    Login page for a supplier (djtraders/views.py's supplier_login_view),
    the page an anonymous visitor lands on (views.py's home redirects
    here). "error" is only set after a failed POST; it's None on the
    first GET. "suppliers" is a supplier queryset, ordered by
    company_name, driving the Supplier dropdown below -- a supplier picks
    their company by name rather than typing a 5-character supplier ID,
    the same pattern login.html uses for its employee dropdown.

    A centered card styled with the supplier color scheme --
    dt-btn-primary-supplier for Log In, dt-icon for the heading icon --
   mirroring the layout used by customer_login.html and login.html.  The
    Employee Login link below the form is the other path in, for an
    employee instead of a supplier.
-->
{% extends "common/base.html" %}

{% block title %}Supplier Login{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card mt-4 border-0 shadow-sm">
                <div class="card-header fw-bolder h4">
                    <i class="fa-solid fa-user-lock dt-icon"></i>
                    Supplier Login
                </div>
                <div class="card-body">
                    {% if error %}
                        <div class="alert alert-danger py-2">{{ error }}</div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="supplier-select" class="form-label">Company</label>
                            <select name="supplier_id" id="supplier-select" class="form-select" required>
                                <option value="">Select a Supplier</option>
                                {% for supplier in suppliers %}
                                    <option value="{{ supplier.supplier_id }}">{{ supplier.company_name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="password-input" class="form-label">Password</label>
                            <input type="password"
                                   name="password"
                                   id="password-input"
                                   class="form-control"
                                   required>
                                   <div class="form-text">Enter the supplier ID as the password.</div>

                        </div>

                        <button type="submit" class="btn dt-btn-primary-supplier w3-hover-shadow w-100" title="Log in">
                            <i class="fa-solid fa-right-to-bracket me-1"></i>
                            Log In
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <div class="dt-link-wrap btn btn-sm dt-btn-secondary-employee w3-hover-shadow">
                            <a href="{% url 'djtraders:login' %}" title="Log in as an employee">
                                <i class="fa-solid fa-user-lock me-1"></i>
                                Employee Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
